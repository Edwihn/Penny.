<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#234c3e" />
    <meta name="description" content="Penny — a little clarity for your everyday spending. Track expenses and see your week at a glance." />
    <title>Penny · Expense Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved/system theme before first paint to avoid a bright flash.
      let theme;
      try { theme = localStorage.getItem('penny-theme'); } catch {}
      document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
        ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
